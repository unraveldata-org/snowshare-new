name: Code Quality Scan

on:
  workflow_dispatch:

jobs:
  sonar-scan:
    runs-on: [self-hosted, quick]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SonarScanner via Docker
        run: |
          docker run --rm \
            -e SONAR_HOST_URL="http://172.36.1.205:9300" \
            -e SONAR_TOKEN="23ea17524d528ec65084cf6e01f94caaefbf3688" \
            -v "${{ github.workspace }}:/usr/src" \
            sonarsource/sonar-scanner-cli:4.7 \
            -Dsonar.projectKey=secureshare \
            -Dsonar.sources=. \
            -Dsonar.login="23ea17524d528ec65084cf6e01f94caaefbf3688"
